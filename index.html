<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>학습노트</title>
<meta name="app-runtime" content="local-static-files-no-network-api" />
<meta name="description" content="사회·문화 수능 대비 단원별 개념 문제 연습 사이트. 기출 스타일 5지선다 문제와 상세 해설, 오답 노트, 단원별 개념 정리 제공." />
<meta name="theme-color" content="#2456E6" />
<meta name="application-name" content="학습노트" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="학습노트" />
<link rel="icon" type="image/svg+xml" href="assets/app-icon.svg" />
<link rel="apple-touch-icon" href="assets/app-icon-192.png" />
<link rel="manifest" href="manifest.webmanifest?v=20261116-name-2" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<a class="skip" href="#main">본문으로 건너뛰기</a>
<header class="site-header">
  <div class="header-inner">
    <a class="logo" href="#" data-nav="home" aria-label="홈으로">
      <img src="assets/app-icon.svg" width="30" height="30" alt="" aria-hidden="true" />
      <span class="logo-text">학습노트</span>
    </a>
    <nav class="gnb" aria-label="주요 메뉴">
      <button class="gnb-btn" data-nav="home" type="button">문제 풀기</button>
      <button class="gnb-btn" data-nav="subject-select" type="button">과목 변경</button>
      <button class="gnb-btn" data-nav="exam" type="button">실전 모의고사</button>
      <button class="gnb-btn" data-nav="game" type="button">지식의 탑</button>
      <button class="gnb-btn" data-nav="concepts" type="button">개념 정리</button>
      <button class="gnb-btn" data-nav="wrong" type="button">오답 노트 <span class="wrong-count" id="wrongCountBadge" hidden>0</span></button>
    </nav>
  </div>
</header>

<main id="main" class="container">
  <!-- 첫 진입 과목 선택 -->
  <section id="view-subject-select" class="view" aria-label="과목 선택" hidden></section>
  <!-- 홈: 단원 선택 -->
  <section id="view-home" class="view" aria-label="홈"></section>
  <!-- 퀴즈 진행 -->
  <section id="view-quiz" class="view" aria-label="문제 풀이" hidden></section>
  <!-- 결과 -->
  <section id="view-result" class="view" aria-label="결과" hidden></section>
  <!-- 실전 모의고사: 시험지 목록 -->
  <section id="view-exam" class="view" aria-label="실전 모의고사" hidden></section>
  <!-- 실전 모의고사: 응시 -->
  <section id="view-examrun" class="view" aria-label="모의고사 응시" hidden></section>
  <!-- 실전 모의고사: 결과 -->
  <section id="view-examresult" class="view" aria-label="모의고사 결과" hidden></section>
  <!-- 학습 게임: 지식의 탑 -->
  <section id="view-game" class="view" aria-label="지식의 탑 게임" hidden></section>
  <!-- 개념 정리 -->
  <section id="view-concepts" class="view" aria-label="개념 정리" hidden></section>
  <!-- 오답 노트 -->
  <section id="view-wrong" class="view" aria-label="오답 노트" hidden></section>
</main>

<footer class="site-footer">
  <p>학습노트 — 2015 개정 교육과정 '사회·문화' 기준 · 개념 문제는 기출 출제 경향을 반영해 자체 제작, 실전 모의고사는 한국교육과정평가원이 출제한 실제 기출(2022~2026학년도 수능·6월·9월)입니다.</p>
</footer>

<script src="js/data.js"></script>
<script src="js/exams.js"></script>
<script src="js/storage.js"></script>
<script src="js/predict.js"></script>
<script src="js/game.js"></script>
<script src="js/pen-tools.js?v=20261116-choice-2"></script>
<script src="js/exam-app.js"></script>
<script src="js/app.js"></script>
<script>
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js', { scope: './' })
      .catch(error => console.warn('[PWA] Service worker registration failed:', error));
  }, { once: true });
}
</script>
</body>
</html>
